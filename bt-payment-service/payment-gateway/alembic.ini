# alembic.ini
# Configuration file for Alembic database migrations.
# This file defines script locations, logging configurations, and formatting parameters.
# The database connection URL is dynamically loaded from the environment within env.py.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, space-delimited, or None. Must include the directory
# where the db/models reside if you're using autogenerate
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to allow for "slug" in
# generate filename. The default is 40.
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded with relative imports
# allow_relative_imports = false

# version locations. specifies where migrations are kept.
# default is alembic/versions
# version_locations = %(here)s/alembic/versions

# version path separator; defaults to os.pathsep.
# Use a space or a newline for multiple version locations
# version_path_separator = :

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)-5.5s] [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
